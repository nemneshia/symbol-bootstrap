services:
    db:
        user: '1000:1000'
        environment:
            MONGO_INITDB_DATABASE: catapult
        container_name: db
        image: mongo:7.0.23
        command: mongod --dbpath=/dbdata --bind_ip=db --wiredTigerCacheSizeGB 2
        stop_signal: SIGINT
        working_dir: /docker-entrypoint-initdb.d
        volumes:
            - ./mongo:/docker-entrypoint-initdb.d:ro
            - ../databases/db:/dbdata:rw
        cpu_count: 2
        mac_address: 02:42:ac:11:65:43
        deploy:
            resources:
                reservations:
                    memory: 4G
    node:
        user: '1000:1000'
        container_name: node
        image: symbolplatform/symbol-server:gcc-1.0.3.9
        command: /bin/bash /symbol-commands/start.sh /usr/catapult ./data server broker node NORMAL true
        stop_signal: SIGINT
        working_dir: /symbol-workdir
        restart: on-failure:2
        ports:
            - '7900:7900'
        ulimits:
            nofile:
                soft: 1048576
                hard: 1048576
        volumes:
            - ../nodes/node:/symbol-workdir:rw
            - ./server:/symbol-commands:ro
        depends_on:
            - db
            - broker
        stop_grace_period: 300s
        cpu_count: 4
        shm_size: 64M
        deploy:
            resources:
                limits:
                    memory: 4G
    broker:
        user: '1000:1000'
        container_name: broker
        image: symbolplatform/symbol-server:gcc-1.0.3.9
        working_dir: /symbol-workdir
        command: /bin/bash /symbol-commands/start.sh /usr/catapult ./data broker server broker NORMAL
        stop_signal: SIGINT
        restart: on-failure:2
        volumes:
            - ../nodes/node:/symbol-workdir:rw
            - ./server:/symbol-commands:ro
        depends_on:
            - db
        stop_grace_period: 20s
    rest-gateway:
        container_name: rest-gateway
        user: '1000:1000'
        environment:
            npm_config_cache: /symbol-workdir
        image: symbolplatform/symbol-rest:2.5.1
        command: npm start --prefix /app /symbol-workdir/rest.json
        stop_signal: SIGINT
        working_dir: /symbol-workdir
        ports:
            - '3000:3000'
        restart: on-failure:2
        volumes:
            - ../gateways/rest-gateway:/symbol-workdir:rw
        depends_on:
            - db
        networks:
            default:
                ipv4_address: 172.20.0.25
networks:
    default:
        ipam:
            config:
                -
                    subnet: 172.20.0.0/24
